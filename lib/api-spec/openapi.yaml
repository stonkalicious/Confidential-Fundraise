openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: raise-claim
    description: Single demo raise claim
  - name: raises
    description: Public raise records and actions
paths:
  /storage/public-objects/agent-raised/{filename}:
    get:
      operationId: getWalkthroughMedia
      summary: Read the public walkthrough video or poster
      description: Public binary media. Supports HEAD and single byte ranges for native video playback and seeking.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            enum: [walkthrough-589be0760638.mp4, walkthrough-589be0760638.webp]
        - name: Range
          in: header
          schema:
            type: string
        - name: If-Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Complete public media file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range; Content-Range describes the returned portion
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Public media not found
        "416":
          description: Invalid or unsatisfiable byte range
        "503":
          description: Public media temporarily unavailable
  /near-intents/session:
    post:
      operationId: authenticateNearIntentsSession
      tags: [raises]
      summary: Disabled NEAR Intents authentication endpoint
      description: NEAR Intents has no testnet; wallet authentication is disabled in this testnet-only demo.
      responses:
        "410":
          description: The mainnet-only integration is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: disconnectNearIntentsSession
      tags: [near-intents-auth]
      summary: Clear the stored NEAR Intents refresh credential
      responses:
        "200":
          description: Stored session credentials cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearIntentsSessionCleared"
  /near-intents/session/refresh:
    post:
      operationId: refreshNearIntentsSession
      tags: [raises]
      summary: Disabled NEAR Intents session refresh endpoint
      description: NEAR Intents has no testnet; session refresh is disabled in this testnet-only demo.
      responses:
        "410":
          description: The mainnet-only integration is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /raise-claim:
    get:
      operationId: getRaiseClaim
      tags: [raise-claim]
      summary: Get the public claim status
      responses:
        "200":
          description: Public claim state; excludes submitted contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
    post:
      operationId: submitRaiseClaim
      tags: [raise-claim]
      summary: Submit the first claim for the demo raise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseClaimInput"
      responses:
        "201":
          description: Claim accepted; returns only the public claim state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
        "400":
          description: Invalid claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The raise has already been claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises:
    post:
      operationId: submitRaise
      tags: [raises]
      summary: Submit a raise for manual approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseSubmissionInput"
      responses:
        "201":
          description: Raise accepted into the private approval queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSubmissionReceipt"
        "400":
          description: Invalid raise details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSubmissionError"
        "429":
          description: Submission rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    get:
      operationId: getRaises
      tags: [raises]
      summary: Get approved public raises and aggregate totals
      description: When ticket filters are provided, return raises whose public round range overlaps the inclusive investor ticket interval. Category and ticket filters are combined.
      parameters:
        - name: category
          in: query
          required: false
          description: Return only raises assigned to this category
          schema:
            $ref: "#/components/schemas/RaiseCategory"
        - name: minRange
          in: query
          required: false
          description: Minimum investor ticket in USD; include raises whose public round maximum is at least this amount
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: maxRange
          in: query
          required: false
          description: Maximum investor ticket in USD; include raises whose public round minimum is at most this amount
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: Approved raises with aggregate totals only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid category or investor ticket range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/pending:
    get:
      operationId: getPendingRaises
      tags: [raises]
      summary: Get pending raises for sponsor review
      security:
        - ApprovalCode: []
      responses:
        "200":
          description: Raises awaiting approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingRaise"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/markdown:
    get:
      operationId: getRaiseMarkdown
      tags: [raises]
      summary: Get one approved public raise as agent-readable Markdown
      description: Returns only the same public raise fields and aggregate totals as the JSON endpoint. Private commitments and contact details are never included.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public raise details as Markdown
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}:
    patch:
      operationId: updateAgentRaise
      tags: [raises]
      summary: Update public page fields using this raise's agent claim token
      description: The bearer token grants page ownership only, not company verification or access to private data. Approval status cannot be changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRaiseUpdate"
      responses:
        "200":
          description: Updated public raise summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid or disallowed public fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid per-raise claim token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    get:
      operationId: getRaiseById
      tags: [raises]
      summary: Get one approved public raise and its aggregate totals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved raise with aggregate totals only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/agent-claim:
    post:
      operationId: reserveAgentRaise
      tags: [raises]
      summary: Reserve an unclaimed raise page for an agent
      description: No company verification is performed. Save the returned token; it is returned only once and authorizes public-field updates on this raise only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Page reserved; includes the one-time claim token and public summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRaiseClaim"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Page already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/private:
    get:
      operationId: getPrivateRaise
      tags: [raises]
      summary: Get private sponsor details for one raise
      security:
        - ApprovalCode: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private commitments and claim contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateRaiseDetails"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/approve:
    post:
      operationId: approveRaise
      tags: [raises]
      summary: Approve a pending raise
      security:
        - ApprovalCode: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved raise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Pending raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/claim:
    post:
      operationId: claimRaise
      tags: [raises]
      summary: Claim a raise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRaiseInput"
      responses:
        "201":
          description: Updated raise after claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Raise already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments:
    post:
      operationId: submitSoftCommitment
      tags: [raises]
      summary: Submit a soft commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftCommitmentInput"
      responses:
        "200":
          description: Existing raise returned for an idempotent commitment submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "201":
          description: Updated raise after commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid soft commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments/{commitmentId}:
    patch:
      operationId: updateRaiseCommitment
      tags: [raises]
      summary: Update a private commitment status
      security:
        - ApprovalCode: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentStatusInput"
      responses:
        "200":
          description: Updated raise after commitment status change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid commitment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise or commitment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments/{commitmentId}/quote:
    post:
      operationId: requestDemoQuote
      tags: [raises]
      summary: Disabled NEAR Intents quote endpoint
      description: NEAR Intents has no testnet; quote requests are disabled in this testnet-only demo.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "410":
          description: The mainnet-only integration is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /demo-settlement-config:
    get:
      operationId: getDemoSettlementConfig
      responses:
        "200":
          description: Fixed Circle USDC contracts; all transfers are exactly 1000000 base units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementConfig" }
  /raises/{id}/demo-settlements/{commitmentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: commitmentId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDemoSettlement
      description: Private to the sponsor or the investor holding the original demo receipt or a valid commitment-specific invite link.
      security: [{ ApprovalCode: [] }, { DemoReceipt: [] }]
      responses:
        "200":
          description: Current immutable transfer details and confirmations, or empty before sponsor setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementState" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
    post:
      operationId: configureDemoSettlement
      security: [{ ApprovalCode: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSettlementInput" }
      responses:
        "200":
          description: Sponsor confirmed the fixed transfer details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementState" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
  /raises/{id}/demo-settlements/{commitmentId}/investor-link:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: commitmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createDemoSettlementInvestorLink
      description: Sponsor-only. Creates or replaces a private investor link for this commitment; the returned token is shown once and expires after seven days.
      security: [{ ApprovalCode: [] }]
      responses:
        "200":
          description: New single-commitment investor access token and expiration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementInvestorLink" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
  /raises/{id}/demo-settlements/{commitmentId}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: commitmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmDemoSettlement
      security: [{ DemoReceipt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSettlementConfirmationInput" }
      responses:
        "200":
          description: Investor confirmed the same immutable transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementState" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
  /raises/{id}/demo-settlements/{commitmentId}/prepare:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: commitmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: prepareDemoSettlement
      security: [{ DemoReceipt: [] }]
      responses:
        "200":
          description: Both confirmations checked; one unique transfer memo is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementState" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
  /raises/{id}/demo-settlements/{commitmentId}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: commitmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: verifyDemoSettlement
      security: [{ DemoReceipt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSettlementVerificationInput" }
      responses:
        "200":
          description: Final successful on-chain USDC transfer verified by the server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementState" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
  /raises/{id}/demo-settlements/{commitmentId}/recovery-request:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: commitmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: requestDemoSettlementRecovery
      description: Investor reports a definite wallet rejection before broadcast. A sponsor must separately approve release of that exact reservation; uncertain outcomes remain reserved.
      security: [{ DemoReceipt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSettlementRecoveryRequest" }
      responses:
        "200":
          description: Investor recovery request recorded for sponsor review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementState" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
  /raises/{id}/demo-settlements/{commitmentId}/recovery-approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: commitmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveDemoSettlementRecovery
      description: Sponsor approves releasing the reservation tied to the investor's reported rejection. Both original transfer confirmations and immutable payment details remain required.
      security: [{ ApprovalCode: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSettlementRecoveryApproval" }
      responses:
        "200":
          description: Sponsor approval recorded and the rejected reservation released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSettlementState" }
        default: { $ref: "#/components/responses/DemoSettlementError" }
components:
  responses:
    DemoSettlementError:
      description: Invalid input, unauthorized role, missing commitment, confirmation conflict, or unavailable NEAR verification. Never treat this as success or automatically resend a payment.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorMessage" }
  securitySchemes:
    DemoReceipt:
      type: apiKey
      in: header
      name: X-Demo-Receipt
    ApprovalCode:
      type: http
      scheme: bearer
  schemas:
    DemoSettlementConfig:
      type: object
      properties:
        testnet: { type: string }
      required: [testnet]
    DemoSettlementInput:
      type: object
      properties:
        network: { type: string, enum: [testnet] }
        receiverAccount: { type: string, minLength: 2, maxLength: 64 }
        reference: { type: string, maxLength: 300 }
        confirmed: { type: boolean }
      required: [network, receiverAccount, confirmed]
    DemoSettlementConfirmationInput:
      type: object
      properties:
        settlementId: { type: string, format: uuid }
        signerAccount: { type: string, minLength: 2, maxLength: 64 }
        confirmed: { type: boolean }
      required: [settlementId, signerAccount, confirmed]
    DemoSettlementVerificationInput:
      type: object
      properties:
        transactionHash: { type: string, minLength: 40, maxLength: 50 }
      required: [transactionHash]
    DemoSettlementRecoveryRequest:
      type: object
      properties:
        confirmedNoBroadcast:
          type: boolean
          description: Investor explicitly confirms the wallet rejected the transfer before submission.
      required: [confirmedNoBroadcast]
    DemoSettlementRecoveryApproval:
      type: object
      properties:
        confirmed:
          type: boolean
          description: Sponsor explicitly approves another attempt for the unchanged transfer details.
      required: [confirmed]
    DemoSettlementInvestorLink:
      type: object
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$" }
        expiresAt: { type: string, format: date-time }
      required: [token, expiresAt]
    DemoSettlementConfirmation:
      type: object
      properties:
        role: { type: string, enum: [sponsor, investor] }
        timestamp: { type: string, format: date-time }
      required: [role, timestamp]
    DemoSettlement:
      type: object
      properties:
        id: { type: string }
        network: { type: string, enum: [testnet, mainnet] }
        tokenContract: { type: string }
        receiverAccount: { type: string }
        reference: { type: string }
        signerAccount: { type: string }
        confirmations:
          type: array
          items: { $ref: "#/components/schemas/DemoSettlementConfirmation" }
        status: { type: string, enum: [awaiting_investor, ready, prepared, success] }
        transferMemo: { type: string }
        transactionHash: { type: string }
        recoveryStatus: { type: string, enum: [awaiting_sponsor, approved] }
        recoveryRequestedAt: { type: string, format: date-time }
        recoveryApprovedAt: { type: string, format: date-time }
      required: [id, network, tokenContract, receiverAccount, confirmations, status]
    DemoSettlementState:
      type: object
      properties:
        settlement: { $ref: "#/components/schemas/DemoSettlement" }
        maySend:
          type: boolean
          description: Returned only by preparation; true only for the request that first reserves this transfer.
    NearIntentsSessionCleared:
      type: object
      properties:
        cleared:
          type: boolean
      required: [cleared]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RaiseClaimStatus:
      type: object
      properties:
        claimed:
          type: boolean
        founderName:
          type: [string, "null"]
      required:
        - claimed
        - founderName
    RaiseClaimInput:
