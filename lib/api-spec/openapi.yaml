          maxLength: 280
        stage:
          type: string
          minLength: 1
          maxLength: 60
        range:
          $ref: "#/components/schemas/RaiseRange"
        status:
          type: string
          enum: [open, paused, closed]
    RaiseSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        thesis:
          type: string
        stage:
          type: string
        range:
          $ref: "#/components/schemas/RaiseRange"
        rangeIsIndicative:
          type: boolean
        categories:
          type: array
          items:
            $ref: "#/components/schemas/RaiseCategory"
        sourceLink:
          type: string
          format: uri
        claimed:
          type: boolean
        status:
          type: string
          enum: [open, paused, closed]
