openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: raise-claim
    description: Single demo raise claim
  - name: raises
    description: Public raise records and actions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /raise-claim:
    get:
      operationId: getRaiseClaim
      tags: [raise-claim]
      summary: Get the public claim status
      responses:
        "200":
          description: Public claim state; excludes submitted contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
    post:
      operationId: submitRaiseClaim
      tags: [raise-claim]
      summary: Submit the first claim for the demo raise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseClaimInput"
      responses:
        "201":
          description: Claim accepted; returns only the public claim state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
        "400":
          description: Invalid claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The raise has already been claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises:
    post:
      operationId: submitRaise
      tags: [raises]
      summary: Submit a raise for manual approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseSubmissionInput"
      responses:
        "201":
          description: Raise accepted into the private approval queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSubmissionReceipt"
        "400":
          description: Invalid raise details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Submission rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    get:
      operationId: getRaises
      tags: [raises]
      summary: Get approved public raises and aggregate totals
      responses:
        "200":
          description: Approved raises with aggregate totals only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RaiseSummary"
  /raises/pending:
    get:
      operationId: getPendingRaises
      tags: [raises]
      summary: Get pending raises for sponsor review
      security:
        - ApprovalCode: []
      responses:
        "200":
          description: Raises awaiting approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingRaise"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}:
    patch:
      operationId: updateAgentRaise
      tags: [raises]
      summary: Update public page fields using this raise's agent claim token
      description: The bearer token grants page ownership only, not company verification or access to private data. Approval status cannot be changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRaiseUpdate"
      responses:
        "200":
          description: Updated public raise summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid or disallowed public fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid per-raise claim token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    get:
      operationId: getRaiseById
      tags: [raises]
      summary: Get one approved public raise and its aggregate totals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved raise with aggregate totals only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/agent-claim:
    post:
      operationId: reserveAgentRaise
      tags: [raises]
      summary: Reserve an unclaimed raise page for an agent
      description: No company verification is performed. Save the returned token; it is returned only once and authorizes public-field updates on this raise only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Page reserved; includes the one-time claim token and public summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRaiseClaim"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Page already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/private:
    get:
      operationId: getPrivateRaise
      tags: [raises]
      summary: Get private sponsor details for one raise
      security:
        - ApprovalCode: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private commitments and claim contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateRaiseDetails"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/approve:
    post:
      operationId: approveRaise
      tags: [raises]
      summary: Approve a pending raise
      security:
        - ApprovalCode: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved raise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Pending raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/claim:
    post:
      operationId: claimRaise
      tags: [raises]
      summary: Claim a raise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRaiseInput"
      responses:
        "201":
          description: Updated raise after claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Raise already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments:
    post:
      operationId: submitSoftCommitment
      tags: [raises]
      summary: Submit a soft commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftCommitmentInput"
      responses:
        "200":
          description: Existing raise returned for an idempotent commitment submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "201":
          description: Updated raise after commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid soft commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments/{commitmentId}:
    patch:
      operationId: updateRaiseCommitment
      tags: [raises]
      summary: Update a private commitment status
      security:
        - ApprovalCode: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentStatusInput"
      responses:
        "200":
          description: Updated raise after commitment status change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid commitment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise or commitment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Approval code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments/{commitmentId}/quote:
    post:
      operationId: requestDemoQuote
      tags: [raises]
      summary: Request a synthetic NEAR Intents dry-run quote
      description: Uses fixed synthetic quote values and never executes a swap
      security:
        - ApprovalCode: []
          NearUserSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized quote details returned by NEAR Intents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoIntentsQuote"
        "401":
          description: Sponsor approval code or NEAR user session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise or commitment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Commitment must be hard before requesting a quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: NEAR Intents did not return a quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Sponsor access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "504":
          description: NEAR Intents quote request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  securitySchemes:
    ApprovalCode:
      type: http
      scheme: bearer
    NearUserSession:
      type: apiKey
      in: header
      name: X-NEAR-User-Session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RaiseClaimStatus:
      type: object
      properties:
        claimed:
          type: boolean
        founderName:
          type: [string, "null"]
      required:
        - claimed
        - founderName
    RaiseClaimInput:
      type: object
      properties:
        founderName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        vehicleLink:
          type: string
          maxLength: 500
      required:
        - founderName
        - email
    ClaimRaiseInput:
      type: object
      properties:
        founderName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        signatureOrAccount:
          type: string
          maxLength: 500
      required:
        - founderName
        - email
    AgentRaiseClaim:
      type: object
      properties:
        claimToken:
          type: string
        raise:
          $ref: "#/components/schemas/RaiseSummary"
      required: [claimToken, raise]
    AgentRaiseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        thesis:
          type: string
          minLength: 10
          maxLength: 280
        stage:
          type: string
          minLength: 1
          maxLength: 60
        range:
          $ref: "#/components/schemas/RaiseRange"
        status:
          type: string
          enum: [open, paused, closed]
    RaiseSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        thesis:
          type: string
        stage:
          type: string
        range:
          $ref: "#/components/schemas/RaiseRange"
        claimed:
          type: boolean
        status:
          type: string
          enum: [open, paused, closed]
        claimantName:
          type: [string, "null"]
        softTotal:
          type: integer
          minimum: 0
        hardTotal:
          type: integer
          minimum: 0
      required:
        - id
        - name
        - thesis
        - stage
        - range
        - claimed
        - softTotal
        - hardTotal
    PrivateRaiseDetails:
      allOf:
        - $ref: "#/components/schemas/RaiseSummary"
        - type: object
          properties:
            claim:
              $ref: "#/components/schemas/RaiseClaim"
            commitments:
              type: array
              items:
                $ref: "#/components/schemas/RaiseCommitment"
          required:
            - commitments
    PendingRaise:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        thesis:
          type: string
        stage:
          type: string
        range:
          $ref: "#/components/schemas/RaiseRange"
        status:
          type: string
          enum: [pending]
      required: [id, name, thesis, stage, range, status]
    RaiseSubmissionReceipt:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending]
      required: [id, status]
    RaiseSubmissionInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        thesis:
          type: string
          minLength: 10
          maxLength: 280
        stage:
          type: string
          minLength: 1
          maxLength: 60
        range:
          $ref: "#/components/schemas/RaiseRange"
      required: [name, thesis, stage, range]
    RaiseClaim:
      type: object
      properties:
        founderName:
          type: string
        email:
          type: string
          format: email
        signatureOrAccount:
          type: string
      required:
        - founderName
        - email
    RaiseCommitment:
      type: object
      properties:
        id:
          type: string
        identifier:
          type: string
        amount:
          type: integer
          minimum: 1
        hard:
          type: boolean
        verified:
          type: boolean
      required:
        - id
        - identifier
        - amount
        - hard
        - verified
    SoftCommitmentInput:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        identifier:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          type: integer
          minimum: 1
      required:
        - identifier
        - amount
    CommitmentStatusInput:
      type: object
      properties:
        hard:
          type: boolean
        verified:
          type: boolean
      required:
        - hard
        - verified
    DemoIntentsQuote:
      type: object
      properties:
        dry:
          type: boolean
          const: true
        confidentialityRequested:
          type: string
          enum: [basic]
        inputSymbol:
          type: string
          enum: [USDC]
        outputSymbol:
          type: string
          enum: [USDC]
        inputAmount:
          type: string
        outputAmount:
          type: string
        quoteId:
          type: ["string", "null"]
        quotedAt:
          type: string
          format: date-time
      required:
        - dry
        - confidentialityRequested
        - inputSymbol
        - outputSymbol
        - inputAmount
        - outputAmount
        - quoteId
        - quotedAt
    RaiseRange:
      type: object
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 1
      required:
        - min
        - max
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error

