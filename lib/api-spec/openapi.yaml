        - stage
        - range
        - claimed
        - softTotal
        - hardTotal
    RaiseCategory:
      type: string
      enum:
        - privacy-security
        - ai-agents
        - intents-payments
        - consumer-real-world
    PrivateRaiseDetails:
      allOf:
        - $ref: "#/components/schemas/RaiseSummary"
        - type: object
          properties:
