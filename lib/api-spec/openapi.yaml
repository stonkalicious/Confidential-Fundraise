openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: raise-claim
    description: Single demo raise claim
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /raise-claim:
    get:
      operationId: getRaiseClaim
      tags: [raise-claim]
      summary: Get the public claim status
      responses:
        "200":
          description: Public claim state; excludes submitted contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
    post:
      operationId: submitRaiseClaim
      tags: [raise-claim]
      summary: Submit the first claim for the demo raise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseClaimInput"
      responses:
        "201":
          description: Claim accepted; returns only the public claim state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
        "400":
          description: Invalid claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The raise has already been claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RaiseClaimStatus:
      type: object
      properties:
        claimed:
          type: boolean
        founderName:
          type: [string, "null"]
      required:
        - claimed
        - founderName
    RaiseClaimInput:
      type: object
      properties:
        founderName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        vehicleLink:
          type: string
          maxLength: 500
      required:
        - founderName
        - email
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error

