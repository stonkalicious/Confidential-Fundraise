openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: raise-claim
    description: Single demo raise claim
  - name: raises
    description: Public raise records and actions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /raise-claim:
    get:
      operationId: getRaiseClaim
      tags: [raise-claim]
      summary: Get the public claim status
      responses:
        "200":
          description: Public claim state; excludes submitted contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
    post:
      operationId: submitRaiseClaim
      tags: [raise-claim]
      summary: Submit the first claim for the demo raise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseClaimInput"
      responses:
        "201":
          description: Claim accepted; returns only the public claim state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseClaimStatus"
        "400":
          description: Invalid claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The raise has already been claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises:
    get:
      operationId: getRaises
      tags: [raises]
      summary: Get public raises with claim and commitment details
      responses:
        "200":
          description: Raises with public claim details, commitments, and totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RaiseSummary"
  /raises/{id}:
    get:
      operationId: getRaiseById
      tags: [raises]
      summary: Get one public raise with claim and commitment details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Raise with public claim details, commitments, and totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/claim:
    post:
      operationId: claimRaise
      tags: [raises]
      summary: Claim a raise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRaiseInput"
      responses:
        "201":
          description: Updated raise after claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Raise already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments:
    post:
      operationId: submitSoftCommitment
      tags: [raises]
      summary: Submit a soft commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftCommitmentInput"
      responses:
        "200":
          description: Existing raise returned for an idempotent commitment submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "201":
          description: Updated raise after commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid soft commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /raises/{id}/commitments/{commitmentId}:
    patch:
      operationId: updateRaiseCommitment
      tags: [raises]
      summary: Update a commitment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentStatusInput"
      responses:
        "200":
          description: Updated raise after commitment status change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaiseSummary"
        "400":
          description: Invalid commitment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Raise or commitment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RaiseClaimStatus:
      type: object
      properties:
        claimed:
          type: boolean
        founderName:
          type: [string, "null"]
      required:
        - claimed
        - founderName
    RaiseClaimInput:
      type: object
      properties:
        founderName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        vehicleLink:
          type: string
          maxLength: 500
      required:
        - founderName
        - email
    ClaimRaiseInput:
      type: object
      properties:
        founderName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        signatureOrAccount:
          type: string
          maxLength: 500
      required:
        - founderName
        - email
    RaiseSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        thesis:
          type: string
        stage:
          type: string
        range:
          $ref: "#/components/schemas/RaiseRange"
        claimed:
          type: boolean
        softTotal:
          type: integer
          minimum: 0
        hardTotal:
          type: integer
          minimum: 0
        claim:
          $ref: "#/components/schemas/RaiseClaim"
        commitments:
          type: array
          items:
            $ref: "#/components/schemas/RaiseCommitment"
      required:
        - id
        - name
        - thesis
        - stage
        - range
        - claimed
        - softTotal
        - hardTotal
        - commitments
    RaiseClaim:
      type: object
      properties:
        founderName:
          type: string
        email:
          type: string
          format: email
        signatureOrAccount:
          type: string
      required:
        - founderName
        - email
    RaiseCommitment:
      type: object
      properties:
        id:
          type: string
        identifier:
          type: string
        amount:
          type: integer
          minimum: 1
        hard:
          type: boolean
        verified:
          type: boolean
      required:
        - id
        - identifier
        - amount
        - hard
        - verified
    SoftCommitmentInput:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        identifier:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          type: integer
          minimum: 1
      required:
        - identifier
        - amount
    CommitmentStatusInput:
      type: object
      properties:
        hard:
          type: boolean
        verified:
          type: boolean
      required:
        - hard
        - verified
    RaiseRange:
      type: object
      properties:
        min:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0
      required:
        - min
        - max
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error

