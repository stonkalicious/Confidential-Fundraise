kind = "web"
previewPath = "/"
title = "Agent Raised"
description = "A demo raise directory for public listings, private commitments, aggregate progress, and optional NEAR testnet transfers. NEAR Intents wallet and quote flows are disabled because 1Click has no testnet."
version = "1.0.0"
id = "artifacts/confidential-fundraise-desk"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23068

[services.development]
run = "pnpm --filter @workspace/confidential-fundraise-desk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/confidential-fundraise-desk", "run", "build" ]
serve = "static"
publicDir = "artifacts/confidential-fundraise-desk/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23068"
BASE_PATH = "/"
